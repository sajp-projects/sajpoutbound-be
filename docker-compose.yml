services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outmanage-api
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-outmanage_db}
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:-development_secret_key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=Asia/Jakarta
    depends_on:
      - mysql
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command:
      sh -c "if [ \"$NODE_ENV\" = \"production\" ]; then echo 'Waiting for MySQL to be ready...' &&
      sleep 5 && npx prisma migrate deploy && npm start; else echo 'Waiting for MySQL to be
      ready...' && sleep 5 && npx prisma migrate reset --force && npm run dev; fi"
    restart: unless-stopped
    networks:
      - outmanage-network

  mysql:
    image: mysql:8.0
    container_name: outmanage-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-outmanage_db}
      - MYSQL_USER=${MYSQL_USER:-user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - TZ=Asia/Jakarta
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - outmanage-network
    command:
      mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+07:00

volumes:
  mysql-data:

networks:
  outmanage-network:
    driver: bridge
