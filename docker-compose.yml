services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outmanage-api
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-outmanage_db}
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:-development_secret_key}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - mysql
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: npm run dev
    restart: unless-stopped
    networks:
      - outmanage-network

  mysql:
    image: mysql:8.0
    container_name: outmanage-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-outmanage_db}
      - MYSQL_USER=${MYSQL_USER:-user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - outmanage-network

volumes:
  mysql-data:

networks:
  outmanage-network:
    driver: bridge
